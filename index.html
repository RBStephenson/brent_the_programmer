heprogrammer.com/assets/posts/stl-studio-1-web.jpg","author":{"@id":"https://brenttheprogrammer.com/#person"},"publisher":{"@id":"https://brenttheprogrammer.com/#person"}},{"@type":"BlogPosting","headline":"Hank Progress Update: Leather, Bowstrings, and Getting There","url":"https://brenttheprogrammer.com/?post=hank-progress-update","mainEntityOfPage":"https://brenttheprogrammer.com/?post=hank-progress-update","datePublished":"2026-07-11","dateModified":"2026-07-11","articleSection":"On the Bench","description":"My first real 1:6 figure is starting to look like a ranger instead of a pile of primer. A quick check-in on where Hank stands — and what's still left on the pile.","image":"https://brenttheprogrammer.com/assets/gallery/hank-wip-web.jpg","author":{"@id":"https://brenttheprogrammer.com/#person"},"publisher":{"@id":"https://brenttheprogrammer.com/#person"}},{"@type":"BlogPosting","headline":"Pay the Bills First: A Lesson in Moderation","url":"https://brenttheprogrammer.com/?post=pay-the-bills-first","mainEntityOfPage":"https://brenttheprogrammer.com/?post=pay-the-bills-first","datePublished":"2026-07-11","dateModified":"2026-07-11","articleSection":"Self-Care","description":"Self-care can become avoidance if we're not careful. On the difference between recharging and escaping — and the simple question I ask myself before I let myself paint.","image":"https://brenttheprogrammer.com/assets/posts/pay-the-bills-first-web.jpg","author":{"@id":"https://brenttheprogrammer.com/#person"},"publisher":{"@id":"https://brenttheprogrammer.com/#person"}},{"@type":"BlogPosting","headline":"Print Failures, Laundry, and the Stories We Tell Ourselves","url":"https://brenttheprogrammer.com/?post=print-failures-and-laundry","mainEntityOfPage":"https://brenttheprogrammer.com/?post=print-failures-and-laundry","datePublished":"2026-06-24","dateModified":"2026-06-24","articleSection":"Caregiving","description":"A week of failed prints and a forgotten load of laundry sent me straight to the same verdict: my fault. On the difference between learning from failure and blaming yourself for it — and the grace we extend to everyone except ourselves.","image":"https://brenttheprogrammer.com/assets/posts/print-failures-and-laundry-web.jpg","author":{"@id":"https://brenttheprogrammer.com/#person"},"publisher":{"@id":"https://brenttheprogrammer.com/#person"}},{"@type":"BlogPosting","headline":"The Weight of a Good Day","url":"https://brenttheprogrammer.com/?post=weight-of-a-good-day","mainEntityOfPage":"https://brenttheprogrammer.com/?post=weight-of-a-good-day","datePublished":"2026-06-21","dateModified":"2026-06-21","articleSection":"Caregiving","description":"Father's Day was wonderful — and if you're a caregiver, you probably already know why that sentence makes me uncomfortable. On guilt, the math we do before every outing, and remembering that caring goes both directions.","image":"https://brenttheprogrammer.com/assets/posts/weight-of-a-good-day-web.jpg","author":{"@id":"https://brenttheprogrammer.com/#person"},"publisher":{"@id":"https://brenttheprogrammer.com/#person"}},{"@type":"BlogPosting","headline":"Was It Worth It?","url":"https://brenttheprogrammer.com/?post=was-it-worth-it","mainEntityOfPage":"https://brenttheprogrammer.com/?post=was-it-worth-it","datePublished":"2026-06-14","dateModified":"2026-06-14","articleSection":"Caregiving","description":"This weekend we took a history boat tour as a family — laughter, sunshine, a few hours that weren't about illness. Then the crash came. On PEM, the cost of making memories, and the question every caregiver eventually has to ask.","image":"https://brenttheprogrammer.com/assets/brent-portrait-web.jpg","author":{"@id":"https://brenttheprogrammer.com/#person"},"publisher":{"@id":"https://brenttheprogrammer.com/#person"}},{"@type":"BlogPosting","headline":"Diana, and the Trouble with Gold","url":"https://brenttheprogrammer.com/?post=diana-and-the-gold","mainEntityOfPage":"https://brenttheprogrammer.com/?post=diana-and-the-gold","datePublished":"2026-06-11","dateModified":"2026-06-11","articleSection":"Studio Notes","description":"A progress update on my first model. Skin, hair, and fur are done, and she's actually turning out well. Now I'm on the gold details — and I have learned that painting gold sucks.","image":"https://brenttheprogrammer.com/assets/gallery/diana-web.jpg","author":{"@id":"https://brenttheprogrammer.com/#person"},"publisher":{"@id":"https://brenttheprogrammer.com/#person"}},{"@type":"BlogPosting","headline":"It's Not Personal. It's PEM.","url":"https://brenttheprogrammer.com/?post=its-not-personal-its-pem","mainEntityOfPage":"https://brenttheprogrammer.com/?post=its-not-personal-its-pem","datePublished":"2026-06-07","dateModified":"2026-06-07","articleSection":"Caregiving","description":"One of the hardest lessons I've learned as a caregiver: sometimes the person you love isn't really themselves. Sometimes it's the crash speaking for them — and knowing the difference can change everything.","image":"https://brenttheprogrammer.com/assets/brent-portrait-web.jpg","author":{"@id":"https://brenttheprogrammer.com/#person"},"publisher":{"@id":"https://brenttheprogrammer.com/#person"}},{"@type":"BlogPosting","headline":"Still Getting Set Up","url":"https://brenttheprogrammer.com/?post=still-getting-set-up","mainEntityOfPage":"https://brenttheprogrammer.com/?post=still-getting-set-up","datePublished":"2026-06-03","dateModified":"2026-06-03","articleSection":"Studio Notes","description":"There's a funny part of starting something new that nobody really talks about — the part before the thing looks like a thing. That's where I'm at right now.","image":"https://brenttheprogrammer.com/assets/brent-portrait-web.jpg","author":{"@id":"https://brenttheprogrammer.com/#person"},"publisher":{"@id":"https://brenttheprogrammer.com/#person"}},{"@type":"BlogPosting","headline":"When Burnout Starts Burning Everything Down","url":"https://brenttheprogrammer.com/?post=burnout","mainEntityOfPage":"https://brenttheprogrammer.com/?post=burnout","datePublished":"2026-05-24","dateModified":"2026-05-24","articleSection":"Self-Care","description":"People talk about burnout like it always looks like exhaustion. Mine looked messier than that. On survival mode, therapy, and how sitting down to paint one small thing helped me find my way back.","image":"https://brenttheprogrammer.com/assets/brent-portrait-web.jpg","author":{"@id":"https://brenttheprogrammer.com/#person"},"publisher":{"@id":"https://brenttheprogrammer.com/#person"}}]}]}
